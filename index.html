<body>

        <div class="rightDiv">

                </div>

                <div class="extraMetric d-flex gap-3">

            </div>

            <div class="rightRow rowTwo d-flex justify-content-between align-items-center">
                <div class="AQI rowTwoDiv p-3 d-flex flex-column gap-2">
                    <h5>Air Quality Index (AQI)</h5>

                    <div class="d-flex align-items-center justify-content-between">
                        <img src="./wind.png" alt="" width="40px">
                        <div class="text-center">
                            <h6 id="co">CO</h6>
                            <h6 id="coValue">-</h6>
                        </div>
                        <div class="text-center">

                        </div>

                            <h6 id="o3">O3</h6>

                        </div>

                <div class="sunRise rowTwoDiv p-3 gap-2">
                    <h5 class="m-0">Sunrise & Sunset</h5>

                    <div class="d-flex justify-content-between">
                        <div class="sunriseDiv d-flex gap-2 align-items-center">
                            <img src="./sun (1).png" alt="" width="75px">
                            <div class="d-flex flex-column gap-1">
                                <h6 class="m-0">Sunrise</h6>
                                <h5 class="m-0" id="sunriseTime">-:-- Am</h5>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>

    <script>
        // RATE LIMIT (NO AUTH)


            const RATE_LIMIT = 100; // per hour
            const RATE_WINDOW = 60 * 60 * 1000; // 1 hour

            function checkRateLimit() {
            const now = Date.now();

            let requests = JSON.parse(
                localStorage.getItem("weather_requests")
            ) || [];

            // keeping only last 1 hour requests
            requests = requests.filter(
                time => now - time < RATE_WINDOW
            );

            if (requests.length >= RATE_LIMIT) {
                alert("Rate limit exceeded. Please try again later.");
                return false;
            }

            requests.push(now);

            localStorage.setItem(
                "weather_requests",
                JSON.stringify(requests)
            );

            return true;
            }




     function dateFormat(timestamp) {
        const date = new Date(timestamp * 1000);
        return date.toLocaleString();
    }

    // WEATHER IMAGE MAPPER 
    function getWeatherImage(weatherMain, windSpeed, temp) {

        if (weatherMain === "Thunderstorm") return "./flood.png";
        if (weatherMain === "Rain") return "./rainypng.png";
        if (weatherMain === "Drizzle") return "./rainypng.png";
        if (weatherMain === "Snow") return "./clouds.png";

        if (weatherMain === "Clear") {
            return temp > 30 ? "./hot.png" : "./sun.png";
        }

        if (weatherMain === "Clouds") return "./cloudy.png";

        if (weatherMain === "Mist" || weatherMain === "Smoke" || weatherMain === "Haze")
            return "./cloud.png";

        if (windSpeed > 12) return "./wind.png";

        return "./cloud.png"; // fallback
    }
    async function fetchByCityName(city) {
        document.querySelector(".inputfield").value = city;
        await fetchData();
    }



        async function fetchAQIData(lat, lon) {
            let fetchAQIData = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=d28274b5fe592e1f1e558103a5e66370`)
            let formattedData = await fetchAQIData.json();
            console.log('AQI Data: ', formattedData);
            let list = formattedData.list[0].components;
            console.log("Line 242: ", list);

            $("#no2Value")[0].innerText = list.no2

            $("#o3Value")[0].innerText = list.o3

            $("#coValue")[0].innerText = list.co

            $("#so2Value")[0].innerText = list.so2

        }

        async function nextFiveDays(lat, lon) {

            const apiUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=d28274b5fe592e1f1e558103a5e66370&units=metric`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error("Failed to fetch weather data");
                }
                const data = await response.json();

                let dailyForecasts = {};

                //  to Extract unique daily data
                data.list.forEach(item => {
                    let date = item.dt_txt.split(" ")[0]; 
                    if (!dailyForecasts[date]) {
                        dailyForecasts[date] = {
                        temp: item.main.temp.toFixed(1),
                        weatherMain: item.weather[0].main,
                        windSpeed: item.wind.speed,
                        day: new Date(date).toLocaleDateString('en-US', { weekday: 'long' })
                    };

                    }
                });

                // Get first 5 unique days
            let forecastHtml = "";

            Object.keys(dailyForecasts).slice(0, 5).forEach(date => {
                let forecast = dailyForecasts[date];

                let imgSrc = getWeatherImage(
                    forecast.weatherMain,
                    forecast.windSpeed,
                    forecast.temp
                );

                forecastHtml += `
                    <div class="forecastRow d-flex align-items-center justify-content-between">
                        <div class="d-flex gap-1 align-items-center">
                            <img src="${imgSrc}" width="35px">
                            <h6 class="m-0">${forecast.temp} &deg;C</h6>
                        </div>
                        <h6 class="m-0">${forecast.day}</h6>
                        <h6 class="m-0">${date}</h6>
                    </div>
                `;
            });
        
        document.getElementById("forecastContainer").innerHTML = forecastHtml;

            } catch (error) {
                console.error(error);
                alert("Failed to retrieve weather data. Please check your API key.");
            }
        }

        async function todayTemps(lat, lon) {
            const apiUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=d28274b5fe592e1f1e558103a5e66370&units=metric`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error("Failed to fetch weather data");
                }
                            const data = await response.json();
            let todayDate = new Date().toISOString().split("T")[0];
            
            let selectedHours = data.list.slice(0, 5);


            // BEST TIME TODAY 
            let safest = selectedHours[0];

            selectedHours.forEach(h => {
            if (
                h.wind.speed < safest.wind.speed &&
                (h.visibility || 10000) > 5000
            ) {
                safest = h;
            }
            });

            const bestTime = new Date(safest.dt_txt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }
            );

            document.getElementById("bestTime").innerText =
            `Best time to go out today: ${bestTime}`;


            // Get first 6 hourly forecasts

                let todayHtml = "";
                selectedHours.forEach(item => {
                   let img = getWeatherImage(
                     item.weather[0].main,
                    item.wind.speed,
                    item.main.temp
                    );
                    let time = new Date(item.dt_txt).toLocaleTimeString(
                    'en-US',
                    { hour: 'numeric', minute: '2-digit', hour12: true }
                    );
                    let temp = item.main.temp.toFixed(1);
                    todayHtml += `
                        <div class="todayTemp">
                            <h6 class="m-0">${time}</h6>
                            <img src="${img}" width="35px">
                            <h5>${temp}&deg;C</h5>
                        </div>
                    `;

                });

                document.getElementById("todayTempContainer").innerHTML = todayHtml;

            } catch (error) {
                console.error(error);
                alert("Failed to retrieve weather data. Please check your API key.");
            }
        }


        function showSuggestions(d) {
        const s = document.getElementById("weatherSuggestion");

        const main = d.weather[0].main;
        const desc = d.weather[0].description.toLowerCase();
        const temp = d.main.temp;
        const wind = d.wind.speed;
        const visibility = d.visibility || 10000;

        if (main === "Rain") {
            s.innerText = "Heavy rain expected. Avoid outdoor travel.";
        }
        else if (main === "Thunderstorm") {
            s.innerText = "Storm conditions detected. Stay indoors.";
        }
        else if (desc.includes("smoke") || desc.includes("haze")) {
            s.innerText = "Poor air quality. Avoid outdoor exposure.";
        }
        else if (temp < 10) {
            s.innerText = "Cold weather. Wear warm clothing.";
        }
        else if (temp > 35) {
            s.innerText = "Extreme heat. Avoid outdoor activities.";
        }
        else if (wind > 12) {
            s.innerText = "Strong winds. Travel cautiously.";
        }
        else if (visibility < 4000) {
            s.innerText = "Low visibility. Avoid long trips.";
        }
        else {
            s.innerText = "Weather conditions are suitable for outdoor activities.";
        }
        }
function showRiskAlert(d) {
    const banner = document.getElementById("riskAlert");
    banner.classList.add("d-none");

    const main = d.weather[0].main;
    const desc = d.weather[0].description.toLowerCase();
    const temp = d.main.temp;
    const wind = d.wind.speed;
    const visibility = d.visibility || 10000;

    let message = "";

    
    if (main === "Thunderstorm") {
        message = "!! Severe thunderstorm / cyclone-like conditions detected. Stay indoors.";
    }

    else if (main === "Rain" || main === "Drizzle") {
        message = "!! Rainfall expected. Outdoor travel may be unsafe.";
    }


    else if (temp <= 5) {
        message = "!! Extreme cold conditions. Risk of cold stress. Avoid long outdoor exposure.";
    }


    else if (temp >= 38) {
        message = "!! Extreme heat warning. Limit outdoor activities and stay hydrated.";
    }

    
    else if (wind >= 12) {
        message = "!! Strong winds expected. Travel cautiously.";
    }

    
    else if (visibility < 4000 || desc.includes("smoke") || desc.includes("haze")) {
        message = "!! Poor visibility / air quality detected. Avoid outdoor exposure.";
    }

    //  Show banner if message exists
    if (message) {
        banner.innerText = message;
        banner.classList.remove("d-none");
    }
}


function highlightParameters(d) {
  const temp = d.main.temp;
  const visibility = d.visibility || 10000;

  const tempEl = document.getElementById("cityTemp");
  const visEl = document.getElementById("visiblity");

  tempEl.classList.remove("highlight-danger");
  visEl.classList.remove("highlight-warning");

  if (temp > 38 || temp < 5) {
    tempEl.classList.add("highlight-danger");
  }

  if (visibility < 4000) {
    visEl.classList.add("highlight-warning");
  }
}

        async function fetchData() {
            

            if (!checkRateLimit()) return;

            let cityName = document.getElementsByClassName('inputfield')[0].value.trim();
            let requestData = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${cityName}&appid=d28274b5fe592e1f1e558103a5e66370&units=metric`)
            let formattedData = await requestData.json();
            if (formattedData.cod !== 200) {
                alert(`"${cityName}" is not a valid city name`);
                    return;
            }
            console.log("Formatted Data: ", formattedData);

            let responseCityName = formattedData.name
            let responseTemp = formattedData.main.temp
            let skyDescription = formattedData.weather[0].description

            $('#cityName')[0].innerText = responseCityName;
            $("#cityTemp")[0].innerText = responseTemp
            $("#skyDesc")[0].innerText = skyDescription
            $("#humidity")[0].innerText=formattedData.main.humidity
            $("#pressure")[0].innerText=formattedData.main.pressure
            $("#feelsLike")[0].innerText=formattedData.main.feels_like
            $("#visiblity")[0].innerText=formattedData.visibility


            //Updating date and time
            let properDate = dateFormat(formattedData.dt);
            let date = properDate.split(',')[0]
            let time = properDate.split(',')[1]
            $("#date")[0].innerText = date;
            $("#time")[0].innerText = time

            //updating sunrise and sunset
            let sunriseTimeStamp = formattedData.sys.sunrise;
            let sunsetTimeStamp = formattedData.sys.sunset;
            let properSunriseTime = dateFormat(sunriseTimeStamp).split(',')[1]
            let properSunsetTime = dateFormat(sunsetTimeStamp).split(',')[1];

            $("#sunriseTime")[0].innerText = properSunriseTime
            $("#sunsetTime")[0].innerText = properSunsetTime


            let lat = formattedData.coord.lat;
            let lon = formattedData.coord.lon;

            fetchAQIData(lat, lon);
            nextFiveDays(lat, lon);
            todayTemps(lat, lon);

            showSuggestions(formattedData);
            showRiskAlert(formattedData);
            highlightParameters(formattedData);
            calculateWeatherConfidence(formattedData);


            document.getElementById("lastUpdated").innerText ="Last updated: just now";


        }
async function fetchWeatherByCoords(lat, lon) {


    const res = await fetch(
        `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=d28274b5fe592e1f1e558103a5e66370&units=metric`
    );

    if (!res.ok) {
        alert("Unable to fetch location weather");
        return;
    }

    const data = await res.json();

        $("#cityName").text(
        data.name + " "
        );

    $("#cityTemp").text(data.main.temp);
    $("#skyDesc").text(data.weather[0].description);
    $("#humidity").text(data.main.humidity);
    $("#pressure").text(data.main.pressure);
    $("#feelsLike").text(data.main.feels_like);
    $("#visiblity").text(data.visibility);

    const properDate = dateFormat(data.dt);
    $("#date").text(properDate.split(",")[0]);
    $("#time").text(properDate.split(",")[1]);

    $("#sunriseTime").text(dateFormat(data.sys.sunrise).split(",")[1]);
    $("#sunsetTime").text(dateFormat(data.sys.sunset).split(",")[1]);

    fetchAQIData(lat, lon);
    nextFiveDays(lat, lon);
    todayTemps(lat, lon);
    showSuggestions(data);
    showRiskAlert(data);
    highlightParameters(data);
    calculateWeatherConfidence(data);

    document.getElementById("lastUpdated").innerText ="Last updated: just now";



}
    window.onload = () => {
  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
  position => {
    fetchWeatherByCoords(
      position.coords.latitude,
      position.coords.longitude
    );
  },
  () => fetchByCityName("Delhi"),
  {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 10000
  }
);

  } else {
    fetchByCityName("Delhi");
  }
};

function calculateWeatherConfidence(d) {
  let score = 100;

  const temp = d.main.temp;
  const wind = d.wind.speed;
  const visibility = d.visibility || 10000;
  const main = d.weather[0].main;

  if (temp > 38 || temp < 5) score -= 25;
  if (main === "Rain" || main === "Drizzle") score -= 20;
  if (main === "Thunderstorm") score -= 35;
  if (wind > 12) score -= 15;
  if (visibility < 4000) score -= 15;

  score = Math.max(0, Math.min(score, 100));

  let text = "Safe & Comfortable ";
  if (score < 70) text = "Moderate Conditions ";
  if (score < 40) text = "Unsafe Weather ";

  document.getElementById("confidenceScore").innerText =
    `${score} / 100`;
  document.getElementById("confidenceText").innerText = text;
}


</script>
